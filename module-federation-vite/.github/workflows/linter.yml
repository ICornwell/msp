name: PR Prettier Check

on:
  pull_request:
    branches:
      - main

permissions:
  pull-requests: read

jobs:
  ########### LINT PACKAGE ############
  lint-package:
    name: Lint Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'yarn'
          registry-url: https://registry.npmjs.org/

      - run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Prettier Check
        if: ${{ always() }}
        run: yarn workspace @module-federation/vite fmt.check
