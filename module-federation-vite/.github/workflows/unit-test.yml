name: Unit Test Check

on:
  pull_request:
    branches:
      - main

permissions:
  pull-requests: read

jobs:
  ########### UNIT TEST PACKAGE ############
  unit-test-package:
    name: Unit Test Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'yarn'
          registry-url: https://registry.npmjs.org/

      - run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Test Library Check
        if: ${{ always() }}
        run: yarn workspace @module-federation/vite test
