[package]
name = "fp_js"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
neon = { version = "1", optional = true }
fpdec = { version = "0.11", features = ["serde-as-str"] }
serde = { version = "1.0", features = ["derive"] }
wasm-bindgen = { version = "0.2", optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }

[features]
default = ["neon_build"]
neon_build = ["neon"]
wasm_build = ["wasm-bindgen", "getrandom/js"]
